name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
      - name: Validate repository baseline
        run: python3 tools/check_repository.py
