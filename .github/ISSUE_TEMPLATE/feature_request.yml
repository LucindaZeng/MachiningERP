name: 功能需求
description: 提交可评审、可实现、可验收的 ERP 功能需求
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: requirement_id
    attributes:
      label: 需求编号
      description: 例如 MKT-01、MES-13、FIN-22；新需求可填写 Proposed
      placeholder: MKT-01
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 业务领域
      options:
        - 组织与部门 ORG
        - 报价与合同 QTN
        - 主数据与工程 MDM
        - PMC/MRP/APS
        - 采购与供应商 SRM
        - 金属材料价格 MKT
        - 生产/后工序/组装 MES
        - 品质 QMS
        - 仓储 WMS
        - 财务与成本 FIN
        - 行政考勤与劳务 ADM
        - 单据与报表 DOC
        - 预警 ALT
        - 客户协同 CUS
        - BI/AI
        - 安全与平台 SEC
    validations:
      required: true
  - type: textarea
    id: role_scenario
    attributes:
      label: 角色与业务场景
      description: 谁在什么条件下，为了什么目标执行什么操作？
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: 详细业务规则
      description: 包括正常、替代、异常、撤销/冲销、状态和版本规则
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据、接口与文件
      description: 输入、输出、来源、关键字段、接口、打印、报表和历史快照
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: 权限、审批、预警与审计
      description: 组织/字段范围、职责分离、SLA、升级、日志和敏感数据
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用 Given/When/Then 或明确的输入、操作、期望结果和证据
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 已搜索现有 Issue 和需求矩阵，确认不是重复项
          required: true
        - label: 未包含真实客户、供应商、财务、个人或凭据信息
          required: true
